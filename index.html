<script> 
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbyaQJMhRAc3ARyY8_0g2STjwY4R2p3xNZfeCxqfCcW-FlbqaEIbrVSqJ-3GYyoP_9Lw/exec';
     
    let allItems = []; 
    let idx = 0; 
    let isGridView = true;  
    let savedScrollY = 0; // Зберігаємо позицію прокрутки сітки

    // Обробка кнопки «Назад» у браузері / телефоні
    window.addEventListener('popstate', (event) => {
        if (event.state && event.state.hasOwnProperty('idx')) {
            idx = event.state.idx;
            isGridView = event.state.isGridView;
            savedScrollY = event.state.scrollY || 0;
        } else {
            isGridView = true;
            savedScrollY = 0;
        }
        render(false);
        
        // Якщо повернулися до сітки, відновлюємо позицію прокрутки
        if (isGridView) {
            setTimeout(() => {
                window.scrollTo({ top: savedScrollY, behavior: 'instant' });
            }, 10);
        }
    });

    // ОНОВЛЕНА ФУНКЦІЯ ПАРСИНГУ ДАТИ
    function parseSecureDate(dateInput) {
        if (!dateInput || dateInput.toString().trim() === "" || dateInput === "-") return null;
        
        let d, m, y;
        let str = dateInput.toString().trim();
        
        if (str.includes('T') || str.includes('Z')) {
            let pureObj = new Date(str);
            if (!isNaN(pureObj.getTime())) {
                let kyivTimeStr = pureObj.toLocaleString("en-US", {timeZone: "Europe/Kyiv"});
                let kyivDate = new Date(kyivTimeStr);

                d = kyivDate.getDate();
                m = kyivDate.getMonth();
                y = kyivDate.getFullYear();
            }
        } else {
            let s = str.split('T')[0].split(' ')[0]; 
            let parts = s.includes('.') ? s.split('.') : s.split('-'); 
            if (parts.length < 3) return null; 
            
            if (parts[0].length === 4) { 
                y = parseInt(parts[0]); m = parseInt(parts[1]) - 1; d = parseInt(parts[2]); 
            } else { 
                d = parseInt(parts[0]); m = parseInt(parts[1]) - 1; y = parseInt(parts[2]); 
            }
        }

        if (d === undefined || m === undefined || y === undefined || isNaN(d) || isNaN(m) || isNaN(y)) return null;

        return { day: d, month: m, year: y };
    }
        
    // Перевірка сесії при завантаженні сторінки
    window.addEventListener('DOMContentLoaded', () => {
        const savedEmail = localStorage.getItem('allowed_email');
        if (savedEmail) {
            document.getElementById('authBlock').style.display = 'none';
            document.getElementById('appBlock').style.display = 'flex';
            load(savedEmail);
        }
    });

    // Авторизація: Крок 1 — відправка коду
    async function sendCode() {
        const emailInput = document.getElementById('authEmail').value.trim();
        const msgBlock = document.getElementById('authMessage');
        const btn = document.getElementById('btnSendCode');

        if (!emailInput) {
            showMsg('Будь ласка, введіть E-mail', 'error');
            return;
        }

        btn.disabled = true;
        showMsg('Надсилання запиту...', 'loading');

        try {
            const response = await fetch(`${scriptUrl}?action=sendCode&email=${encodeURIComponent(emailInput)}`);
            const result = await response.json();

            if (result.status === 'success') {
                document.getElementById('stepEmail').style.display = 'none';
                document.getElementById('stepCode').style.display = 'block';
                showMsg('Код успішно надіслано!', 'success');
            } else {
                showMsg(result.message || 'Помилка доступу. Перевірте ваш E-mail.', 'error');
                btn.disabled = false;
            }
        } catch (e) {
            showMsg('Помилка з\'єднання з сервером.', 'error');
            btn.disabled = false;
        }
    }

    // Авторизація: Крок 2 — перевірка коду
    async function verifyCode() {
        const emailInput = document.getElementById('authEmail').value.trim();
        const codeInput = document.getElementById('authCode').value.trim();
        const btn = document.getElementById('btnVerifyCode');

        if (!codeInput) {
            showMsg('Введіть код підтвердження', 'error');
            return;
        }

        btn.disabled = true;
        showMsg('Перевірка коду...', 'loading');

        try {
            const response = await fetch(`${scriptUrl}?action=verifyCode&email=${encodeURIComponent(emailInput)}&code=${encodeURIComponent(codeInput)}`);
            const result = await response.json();

            if (result.status === 'success') {
                localStorage.setItem('allowed_email', emailInput);
                showMsg('Успішний вхід!', 'success');
                setTimeout(() => {
                    document.getElementById('authBlock').style.display = 'none';
                    document.getElementById('appBlock').style.display = 'flex';
                    load(emailInput);
                }, 1000);
            } else {
                showMsg(result.message || 'Невірний код.', 'error');
                btn.disabled = false;
            }
        } catch (e) {
            showMsg('Помилка верифікації.', 'error');
            btn.disabled = false;
        }
    }

    function showMsg(text, type) {
        const msgBlock = document.getElementById('authMessage');
        msgBlock.innerText = text;
        msgBlock.className = 'auth-msg ' + (type === 'error' ? 'msg-error' : type === 'success' ? 'msg-success' : 'msg-loading');
    }

    // Завантаження даних для авторизованого користувача
    async function load(email) { 
        try { 
            const r = await fetch(`${scriptUrl}?action=getBrothersData&email=${encodeURIComponent(email)}`); 
            allItems = await r.json(); 
            
            history.replaceState({ idx: idx, isGridView: isGridView, scrollY: 0 }, '', '');
            render(false); 
        } catch (e) {  
            document.getElementById('catalog').innerHTML = "<div style='color:red; text-align:center;'>Помилка завантаження. Спробуйте оновити сторінку.</div>";  
        } 
    } 

    function toggleView() { 
        isGridView = true; 
        savedScrollY = 0; // Якщо через кнопку "Усі брати", можна скидати або лишати — тут повертаємось до початку сітки, або обійдемося історією
        history.back(); // Емулюємо дію назад, щоб повернутися до попереднього стану сітки з пам'яттю прокрутки
    } 

    function selectFromGrid(index) { 
        savedScrollY = window.scrollY; // Запам'ятовуємо, де знаходились у сітці
        idx = index; 
        isGridView = false; 
        history.pushState({ idx: idx, isGridView: isGridView, scrollY: savedScrollY }, '', '');
        render(); 
        window.scrollTo({ top: 0, behavior: 'smooth' }); 
    } 

    function selectPersonByIndex(index) { 
        document.getElementById('searchInput').value = ""; 
        document.getElementById('searchSuggestions').style.display = 'none'; 
        savedScrollY = window.scrollY;
        idx = index; 
        isGridView = false; 
        history.pushState({ idx: idx, isGridView: isGridView, scrollY: savedScrollY }, '', '');
        render(); 
        window.scrollTo({ top: 0, behavior: 'smooth' });
    } 

    function render(pushToHistory = true) { 
        const catalog = document.getElementById('catalog'); 
        const toggleBtn = document.getElementById('toggleLink'); 
        if (allItems.length === 0) return; 

        if (isGridView) { 
            toggleBtn.style.display = "none"; 
            renderGrid(catalog); 
        } else { 
            toggleBtn.style.display = "inline-block"; 
            renderCard(catalog); 
        } 
    } 

    function renderGrid(container) { 
        container.innerHTML = ` 
            <div class="brothers-grid"> 
                ${allItems.map((p, i) => ` 
                    <div class="grid-item" onclick="selectFromGrid(${i})"> 
                        <div class="grid-photo"> 
                            <img src="${p[0]}" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/100?text=?'"> 
                        </div> 
                        <div class="grid-name">бр. ${p[4]}</div> 
                    </div> 
                `).join('')} 
            </div>`; 
    } 

    function renderCard(container) { 
        const p = allItems[idx]; 
        const monkExp = calculateExperience(p[11]); 
        const priestExp = calculateExperience(p[14]); 

        const firstName = p[5] || '—'; 
        const fatherName = p[6] && p[6] !== "—" && p[6] !== "-" ? `<span class="patronymic">${p[6]}</span>` : ""; 
        const fullNameWithPatronymic = firstName + fatherName; 

        container.innerHTML = ` 
            <div class="card"> 
                <div class="card-header"> 
                    <div class="photo-circle"> 
                        <img src="${p[0]}" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/200?text=фото'"> 
                    </div> 
                    <div class="name-box"> 
                        <h2 class="legal-name">бр. ${p[4] || '—'}</h2> 
                        <div class="surname-main">${p[3] || '—'}</div> 
                    </div> 
                </div> 
                <div class="experience-box"> 
                    ${monkExp ? `<div>${monkExp} чернечого життя</div>` : ''} 
                    ${priestExp ? `<div>${priestExp} священства</div>` : ''} 
                </div> 
                <div class="controls"> 
                    <button class="nav-btn" onclick="change(-1)" ${idx === 0 ? 'disabled' : ''}>←</button> 
                    <span style="font-weight:700;">${idx + 1} / ${allItems.length}</span> 
                    <button class="nav-btn" onclick="change(1)" ${idx === allItems.length - 1 ? 'disabled' : ''}>→</button> 
                </div> 
                <div class="details-grid"> 
                    <div class="detail-row"> 
                        <div class="detail-label">Ім'я з Хрещення</div> 
                        <div class="detail-value">${fullNameWithPatronymic}</div> 
                    </div> 
                    ${createDetail("Іменини", p[8], true, true)} 
                    ${createDetail("День народження", p[7])} 
                    ${createDetail("Місце народження", p[9], false)} 
                    ${createDetail("Новіціат", p[10])} 
                    ${createDetail("Перші обіти", p[11])} 
                    ${createDetail("Вічні обіти", p[12])} 
                    ${createDetail("Дияконат", p[13])} 
                    ${createDetail("Священство", p[14])} 
                </div> 
            </div>`; 
    } 

    function calculateExperience(dateStr) { 
        const parsed = parseSecureDate(dateStr);
        if (!parsed) return null;
        
        let dateObj = new Date(parsed.year, parsed.month, parsed.day); 
        if (isNaN(dateObj.getTime())) return null; 
        
        let today = new Date(); 
        let years = today.getFullYear() - dateObj.getFullYear(); 
        let currentAnniversary = new Date(today.getFullYear(), parsed.month, parsed.day); 
        if (today < currentAnniversary) years--; 
        if (years < 0) return null; 
        
        let suffix = "років"; 
        if (years % 10 === 1 && years % 100 !== 11) suffix = "рік"; 
        else if (years % 10 >= 2 && years % 10 <= 4 && (years % 100 < 10 || years % 100 >= 20)) suffix = "роки"; 
        
        return years + " " + suffix; 
    } 

    function formatDateUk(dateInput, hideYear = false) { 
        const parsed = parseSecureDate(dateInput);
        if (!parsed) return dateInput; 

        const months = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"]; 
        if (parsed.month < 0 || parsed.month > 11) return dateInput; 
        
        return hideYear ? parsed.day + " " + months[parsed.month] : parsed.day + " " + months[parsed.month] + " " + parsed.year; 
    } 

    function createDetail(label, value, isDate = true, hideYear = false) { 
        let displayValue = isDate ? formatDateUk(value, hideYear) : value; 
        if (!displayValue || displayValue === "—" || displayValue === "-" || displayValue.toString().trim() === "") return ""; 

        return `<div class="detail-row"><div class="detail-label">${label}</div><div class="detail-value">${displayValue}</div></div>`; 
    } 

    function change(d) { 
        idx += d; 
        history.replaceState({ idx: idx, isGridView: isGridView, scrollY: savedScrollY }, '', '');
        render(false); 
        window.scrollTo({ top: 0, behavior: 'smooth' }); 
    } 

    function handleSearch() { 
        const term = document.getElementById('searchInput').value.toLowerCase(); 
        const suggestions = document.getElementById('searchSuggestions'); 
        if (term.length < 1) { suggestions.style.display = 'none'; return; } 
         
        let matches = allItems.filter(item =>  
            (item[3]?.toLowerCase().includes(term)) ||  
            (item[4]?.toLowerCase().includes(term)) 
        ); 

        matches.sort((a, b) => { 
            const aSurname = a[3]?.toLowerCase() || ""; 
            const aName = a[4]?.toLowerCase() || ""; 
            const bSurname = b[3]?.toLowerCase() || ""; 
            const bName = b[4]?.toLowerCase() || ""; 
            const aStarts = aSurname.startsWith(term) || aName.startsWith(term); 
            const bStarts = bSurname.startsWith(term) || bName.startsWith(term); 
            if (aStarts && !bStarts) return -1; 
            if (!aStarts && bStarts) return 1; 
            return 0; 
        }); 

        if (matches.length > 0) { 
            suggestions.innerHTML = matches.map((item, i) => { 
                const originalIdx = allItems.findIndex(orig => orig === item); 
                return ` 
                <div class="suggestion-item ${i === 0 ? 'active' : ''}"  
                     onclick="selectPersonByIndex(${originalIdx})"> 
                    <strong>бр. ${item[4]}</strong> ${item[3]} 
                </div>`}).join(''); 
            suggestions.style.display = 'block'; 
        } else { suggestions.style.display = 'none'; } 
    } 

    document.getElementById('searchInput').addEventListener('keydown', function(e) { 
        const suggestions = document.getElementById('searchSuggestions'); 
        const items = suggestions.getElementsByClassName('suggestion-item'); 
        if (items.length === 0) return; 
        let activeIdx = Array.from(items).findIndex(item => item.classList.contains('active')); 
        if (e.key === 'ArrowDown') { 
            e.preventDefault(); 
            items[activeIdx].classList.remove('active'); 
            activeIdx = (activeIdx + 1) % items.length; 
            items[activeIdx].classList.add('active'); 
            items[activeIdx].scrollIntoView({ block: 'nearest' }); 
        } else if (e.key === 'ArrowUp') { 
            e.preventDefault(); 
            items[activeIdx].classList.remove('active'); 
            activeIdx = (activeIdx - 1 + items.length) % items.length; 
            items[activeIdx].classList.add('active'); 
            items[activeIdx].scrollIntoView({ block: 'nearest' }); 
        } else if (e.key === 'Enter') { 
            e.preventDefault(); 
            if (activeIdx >= 0) items[activeIdx].click(); 
        } 
    }); 
 </script>
