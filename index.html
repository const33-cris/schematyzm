<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Схематизм Провінції</title>

    <!-- Налаштування для мобільних пристроїв -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/const33-cris/schematyzm/main/img/icon.png">

    <style>
        :root {
            --primary: #5d4037;
            --bg: #f0f2f5;
            --white: #ffffff;
            --text-main: #1c1e21;
            --text-secondary: #606770;
            --error: #dc3545;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Arial, sans-serif; 
            background-color: var(--bg); 
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; color: var(--text-main);
        }

        /* --- БЛОК АВТОРИЗАЦІЇ --- */
        #auth-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg); z-index: 2000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .auth-card {
            background: white; padding: 40px; border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center;
        }
        .auth-input {
            width: 100%; padding: 14px; margin: 15px 0;
            border: 1px solid #ddd; border-radius: 12px; font-size: 1.1rem;
            box-sizing: border-box; outline: none; text-align: center;
        }
        .auth-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(93, 64, 55, 0.1); }
        .auth-submit {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: opacity 0.2s;
        }
        .auth-submit:disabled { background: #ccc; cursor: not-allowed; }
        .error-msg { 
            color: var(--error); font-size: 0.85rem; margin-top: 12px; 
            display: none; padding: 10px; background: #ffeeee; border-radius: 8px;
            border: 1px solid #ffcccc; line-height: 1.4;
        }

        /* --- ОСНОВНИЙ КОНТЕНТ --- */
        #main-content { display: none; width: 100%; flex-direction: column; align-items: center; }
        
        .header { width: 100%; max-width: 600px; padding: 25px 15px; text-align: center; box-sizing: border-box; }
        .title-main { font-size: 2rem; font-weight: 800; color: var(--primary); text-transform: uppercase; }
        
        .search-container { position: relative; width: 100%; margin-bottom: 20px; }
        #searchInput { 
            width: 100%; padding: 12px 20px; border-radius: 30px; border: 1px solid #ddd; 
            font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.05); outline: none; box-sizing: border-box;
        }

        #catalog { width: 100%; max-width: 600px; padding: 0 10px 40px; box-sizing: border-box; }
        .brothers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; }
        .grid-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .grid-photo { width: 85px; height: 85px; border-radius: 50%; overflow: hidden; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 5px; }
        .grid-photo img { width: 100%; height: 100%; object-fit: cover; }
        .grid-name { font-size: 0.85rem; font-weight: 700; text-align: center; color: var(--primary); }

        @media (max-width: 480px) {
            .brothers-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <!-- ЕКРАН АВТОРИЗАЦІЇ -->
    <div id="auth-container">
        <div id="auth-step-email" class="auth-card">
            <h2 style="color: var(--primary)">Схематизм</h2>
            <p>Введіть email для перевірки доступу (аркуш <b>AllowedUsers</b>)</p>
            <input type="email" id="emailInput" class="auth-input" placeholder="example@gmail.com" value="const33@gmail.com">
            <button class="auth-submit" id="btnSendCode" onclick="sendVerificationCode()">Отримати код</button>
            <div id="emailError" class="error-msg"></div>
        </div>

        <div id="auth-step-code" class="auth-card" style="display: none;">
            <h2>Введіть код</h2>
            <p>На пошту <span id="displayEmail" style="font-weight:bold"></span> надіслано 6-значний код</p>
            <input type="text" id="codeInput" class="auth-input" placeholder="000000" maxlength="6">
            <button class="auth-submit" id="btnVerifyCode" onclick="verifyCode()">Увійти</button>
            <div id="codeError" class="error-msg"></div>
            <button style="background:none; border:none; margin-top:15px; color:var(--text-secondary); cursor:pointer;" onclick="toggleAuthStep(1)">← Змінити пошту</button>
        </div>
    </div>

    <!-- ОСНОВНИЙ ДОДАТОК -->
    <div id="main-content">
        <div class="header">
            <div class="title-main">СХЕМАТИЗМ</div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Пошук за іменем..." oninput="handleSearch()">
            </div>
        </div>
        <div id="catalog">
            <div style="text-align: center; padding: 40px; color: var(--text-secondary);">Завантаження списку...</div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5wF2-YSFjB2NTOzObml4ZLtuKlZdyl72uISyRL9LyFh8dVZLJzy2MEQWS0OsW1OX9/exec';
        
        let allItems = [];
        let userEmail = "";

        function toggleAuthStep(step) {
            document.getElementById('auth-step-email').style.display = step === 1 ? 'block' : 'none';
            document.getElementById('auth-step-code').style.display = step === 2 ? 'block' : 'none';
        }

        async function sendVerificationCode() {
            const btn = document.getElementById('btnSendCode');
            const errorDiv = document.getElementById('emailError');
            const emailInput = document.getElementById('emailInput');
            
            // Очищення від пробілів та переведення в нижній регістр
            userEmail = emailInput.value.trim().toLowerCase();
            
            if (!userEmail || !userEmail.includes('@')) {
                errorDiv.innerText = "Будь ласка, введіть дійсний email";
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerText = "Перевірка доступу...";
            errorDiv.style.display = 'none';

            try {
                // Додаємо випадковий параметр, щоб уникнути кешування відповіді
                const response = await fetch(`${SCRIPT_URL}?action=sendCode&email=${encodeURIComponent(userEmail)}&t=${Date.now()}`);
                const result = await response.json();

                if (result.status === "success") {
                    document.getElementById('displayEmail').innerText = userEmail;
                    toggleAuthStep(2);
                } else {
                    // Показуємо детальну причину відмови
                    errorDiv.innerHTML = `<strong>Доступ заблоковано:</strong><br>${result.message || "Пошту не знайдено в списку дозволених."}`;
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.innerHTML = "<strong>Помилка мережі:</strong><br>Не вдалося з'єднатися зі скриптом. Перевірте, чи опубліковано його як веб-додаток.";
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "Отримати код";
            }
        }

        async function verifyCode() {
            const btn = document.getElementById('btnVerifyCode');
            const errorDiv = document.getElementById('codeError');
            const code = document.getElementById('codeInput').value.trim();

            if (code.length < 6) return;

            btn.disabled = true;
            btn.innerText = "Увійти...";

            try {
                const response = await fetch(`${SCRIPT_URL}?action=verifyCode&email=${encodeURIComponent(userEmail)}&code=${code}`);
                const result = await response.json();

                if (result.status === "success") {
                    document.getElementById('auth-container').style.display = 'none';
                    document.getElementById('main-content').style.display = 'flex';
                    loadData();
                } else {
                    errorDiv.innerText = "Код неправильний";
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.innerText = "Помилка підключення";
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "Увійти";
            }
        }

        async function loadData() {
            try {
                const r = await fetch(`${SCRIPT_URL}?action=getData`);
                allItems = await r.json();
                render(allItems);
            } catch (e) {
                document.getElementById('catalog').innerHTML = "Помилка завантаження бази даних.";
            }
        }

        function render(data) {
            const container = document.getElementById('catalog');
            if (!data.length) {
                container.innerHTML = "<center>Нічого не знайдено</center>";
                return;
            }
            container.innerHTML = `<div class="brothers-grid">${data.map(p => `
                <div class="grid-item">
                    <div class="grid-photo"><img src="${p[0] || 'https://via.placeholder.com/100'}" referrerpolicy="no-referrer"></div>
                    <div class="grid-name">бр. ${p[4] || 'Без імені'}</div>
                </div>`).join('')}</div>`;
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allItems.filter(p => 
                (p[4] && p[4].toLowerCase().includes(q)) || 
                (p[3] && p[3].toLowerCase().includes(q))
            );
            render(filtered);
        }
    </script>
</body>
</html>
