<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Схематизм Провінції</title>

    <meta name="apple-mobile-web-app-title" content="Схематизм">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/const33-cris/schematyzm/main/img/icon.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/const33-cris/schematyzm/main/img/icon.png?v=2">

    <style>
        :root {
            --primary: #5d4037;
            --text-main: #1c1e21;
            --text-secondary: #606770;
            --bg: #f0f2f5;
            --accent-blue: #003366;
            --error: #dc3545;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Arial, sans-serif; 
            background-color: var(--bg); 
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; color: var(--text-main);
        }

        /* --- БЛОК АВТОРИЗАЦІЇ (З вчорашнього коду) --- */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 10000;
            display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
        }
        .auth-card {
            background: white; padding: 40px 30px; border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%; max-width: 400px; text-align: center;
        }
        .auth-card h2 { color: var(--primary); margin: 0 0 10px; font-weight: 800; }
        .auth-input {
            width: 100%; padding: 14px 20px; border-radius: 30px;
            border: 1px solid #ddd; margin-bottom: 15px; font-size: 16px;
            box-sizing: border-box; outline: none; -webkit-appearance: none;
            background: #fff; text-align: center;
        }
        .auth-btn {
            width: 100%; padding: 15px; border-radius: 30px; border: none;
            background: var(--primary); color: white; font-weight: 800;
            font-size: 16px; cursor: pointer; transition: background 0.3s;
            text-transform: uppercase;
        }
        .auth-btn:disabled { background: #ccc; cursor: not-allowed; }
        #errorLabel { color: var(--error); font-size: 0.85rem; margin-top: 15px; display: none; line-height: 1.4; }

        /* --- ОСНОВНИЙ ІНТЕРФЕЙС --- */
        #appContent { display: none; width: 100%; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 600px; padding: 25px 15px 5px; text-align: center; box-sizing: border-box; }
        .title-main { font-size: 2.2rem; font-weight: 800; color: var(--primary); text-transform: uppercase; margin-bottom: 2px; letter-spacing: 1px; }
        .title-sub { font-size: 0.9rem; font-weight: 400; color: var(--primary); text-transform: uppercase; margin-bottom: 20px; }
        
        .search-container { position: relative; width: 100%; margin-bottom: 20px; }
        #searchInput { 
            width: 100%; padding: 12px 20px; border-radius: 30px; border: 1px solid #ddd; 
            font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); outline: none; box-sizing: border-box;
        }

        #catalog { width: 100%; max-width: 600px; padding: 0 10px 40px; box-sizing: border-box; }
        .brothers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; }
        .grid-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .grid-photo { width: 85px; height: 85px; border-radius: 50%; overflow: hidden; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 5px; background: #eee; }
        .grid-photo img { width: 100%; height: 100%; object-fit: cover; }
        .grid-name { font-size: 0.85rem; font-weight: 700; text-align: center; color: var(--primary); }

        @media (max-width: 480px) {
            .brothers-grid { grid-template-columns: repeat(2, 1fr); }
            .grid-photo { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="auth-card">
            <h2>Вхід</h2>
            <p id="authHint" style="font-size: 0.9rem; color: #666; margin-bottom: 20px;">Введіть ваш email для доступу</p>
            <input type="email" id="emailInput" class="auth-input" placeholder="example@gmail.com">
            <input type="text" id="codeInput" class="auth-input" placeholder="Код з пошти" style="display:none;" maxlength="6">
            <button id="authBtn" class="auth-btn" onclick="processAuth()">Отримати код</button>
            <p id="errorLabel"></p>
        </div>
    </div>

    <div id="appContent">
        <div class="header">
            <div class="title-main">СХЕМАТИЗМ</div>
            <div class="title-sub">ПРОВІНЦІЇ СВ. АРХАНГЕЛА МИХАЇЛА</div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Пошук..." oninput="handleSearch()" autocomplete="off">
            </div>
        </div>
        <div id="catalog">
            <div style="text-align: center; padding: 40px; color: var(--text-secondary);">Завантаження списку...</div>
        </div>
    </div>

    <script>
        // ВИКОРИСТОВУЄМО ВАШ ПРАВИЛЬНИЙ URL СКРИПТА
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbyaQJMhRAc3ARyY8_0g2STjwY4R2p3xNZfeCxqfCcW-FlbqaEIbrVSqJ-3GYyoP_9Lw/exec';
        
        let allItems = [];
        let currentUserEmail = "";

        // ПЕРЕВІРКА СЕСІЇ ПРИ ЗАВАНТАЖЕННІ (з вчорашнього коду)
        window.onload = () => {
            const savedEmail = localStorage.getItem('userEmail');
            if (savedEmail) {
                currentUserEmail = savedEmail;
                document.getElementById('authOverlay').style.display = "none";
                document.getElementById('appContent').style.display = "flex";
                loadDirect();
            }
        };

        // ЛОГІКА АВТОРИЗАЦІЇ (з вчорашнього коду)
        async function processAuth() {
            const btn = document.getElementById('authBtn');
            const emailInp = document.getElementById('emailInput');
            const codeInp = document.getElementById('codeInput');
            const error = document.getElementById('errorLabel');
            
            error.style.display = "none";
            btn.disabled = true;

            if (codeInp.style.display === "none") {
                currentUserEmail = emailInp.value.trim().toLowerCase();
                if (!currentUserEmail) { btn.disabled = false; return; }
                
                btn.innerText = "Надсилаємо...";
                try {
                    const r = await fetch(`${scriptUrl}?action=sendCode&email=${encodeURIComponent(currentUserEmail)}`);
                    const res = await r.json();
                    if (res.success) {
                        emailInp.style.display = "none";
                        codeInp.style.display = "block";
                        btn.innerText = "Увійти";
                        btn.disabled = false;
                        document.getElementById('authHint').innerText = "Код надіслано на пошту";
                    } else { throw new Error(res.message || "Помилка доступу"); }
                } catch (e) {
                    error.innerText = e.message; error.style.display = "block";
                    btn.innerText = "Отримати код"; btn.disabled = false;
                }
            } else {
                const code = codeInp.value.trim();
                btn.innerText = "Перевірка...";
                try {
                    const r = await fetch(`${scriptUrl}?action=verifyCode&email=${encodeURIComponent(currentUserEmail)}&code=${code}`);
                    const res = await r.json();
                    if (res.success) {
                        localStorage.setItem('userEmail', currentUserEmail);
                        allItems = res.data.slice(1);
                        startApp();
                    } else { throw new Error(res.message || "Невірний код"); }
                } catch (e) {
                    error.innerText = e.message; error.style.display = "block";
                    btn.innerText = "Увійти"; btn.disabled = false;
                }
            }
        }

        async function loadDirect() {
            try {
                const r = await fetch(`${scriptUrl}?action=verifyCode&email=${encodeURIComponent(currentUserEmail)}&code=session`);
                const res = await r.json();
                if (res.success && res.data) {
                    allItems = res.data.slice(1);
                    render();
                } else {
                    localStorage.removeItem('userEmail');
                    location.reload();
                }
            } catch (e) { console.error("Session error", e); }
        }

        function startApp() {
            document.getElementById('authOverlay').style.display = "none";
            document.getElementById('appContent').style.display = "flex";
            render();
        }

        function render() {
            const container = document.getElementById('catalog');
            if (allItems.length === 0) return;
            
            container.innerHTML = `<div class="brothers-grid">${allItems.map((p, i) => `
                <div class="grid-item">
                    <div class="grid-photo"><img src="${p[0]}" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/100'"></div>
                    <div class="grid-name">бр. ${p[4]}</div>
                </div>`).join('')}</div>`;
        }

        function handleSearch() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allItems.filter(item => 
                (item[3]?.toLowerCase().includes(term)) || 
                (item[4]?.toLowerCase().includes(term))
            );
            
            const container = document.getElementById('catalog');
            container.innerHTML = `<div class="brothers-grid">${filtered.map((p) => `
                <div class="grid-item">
                    <div class="grid-photo"><img src="${p[0]}" referrerpolicy="no-referrer"></div>
                    <div class="grid-name">бр. ${p[4]}</div>
                </div>`).join('')}</div>`;
        }
    </script>
</body>
</html>
